<label class="custom-radio-container">
  <input
    type="radio"
    [name]="name"
    [value]="value"
    [class]="'custom-radio ' + radioClass"
    [checked]="isChecked"
    [disabled]="disabled"
    (change)="onInputChange()"
  />
  <div class="label">
    @if (label.length > 0 ) {
    <span class="radio-label">
      {{ subLabel }}
    </span>
    @if (subLabel.length > 0) {
    <span class="radio-sub-label">
      {{ label }}
    </span>
    } }
  </div>
</label>
