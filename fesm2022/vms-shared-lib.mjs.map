<div
  class="radio-group"
  [formGroup]="parentForm"
  [class]="{ 'is-column': column }"
>
  @for (option of options; track $index) {
    <label class="custom-radio-wrapper">
      <div class="radio-error-container">
        <custom-app-error
          [control]="parentForm.controls[controlName]"
          [validation]="validation"
          [name]="name"
        />
      </div>
      <input
        (change)="onRadioChange(option)"
        type="radio"
        [value]="option.value"
        [name]="name"
        [formControlName]="controlName"
      />
      <span class="radio-custom"></span>
      @if (option.templateRef && templates) {
        <ng-template
          *ngTemplateOutlet="
            templates[option.templateRef];
            context: { $implicit: option }
          "
        ></ng-template>
      } @else {
        <p class="label">{{ option.label | translate }}</p>
      }
    </label>
  }
</div>
