<div class="tooltip-wrapper" [style]="{ '--min-width': minWidth }">
  <ng-content></ng-content>

  @if (visible) {
    <div class="tooltip tooltip-{{ position }} {{ customClass }}" [ngStyle]="tooltipStyle">
      @if (title) {
        <span class="tooltip-title">
          <div class="tooltip-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M9 17.25C13.5563 17.25 17.25 13.5563 17.25 9C17.25 4.44365 13.5563 0.75 9 0.75C4.44365 0.75 0.75 4.44365 0.75 9C0.75 13.5563 4.44365 17.25 9 17.25Z"
                fill="white"
              />
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M17.25 9C17.25 13.5563 13.5563 17.25 9 17.25C4.44365 17.25 0.75 13.5563 0.75 9C0.75 4.44365 4.44365 0.75 9 0.75C13.5563 0.75 17.25 4.44365 17.25 9ZM8.11268 6.20681C8.41808 6.02732 8.77715 5.96171 9.12629 6.0216C9.47543 6.08148 9.79211 6.263 10.0202 6.534C10.2484 6.80501 10.3732 7.148 10.3727 7.50224L10.3727 7.50336C10.3727 7.85521 10.0989 8.22202 9.58168 8.56682C9.3459 8.724 9.10479 8.8451 8.91966 8.92737C8.82817 8.96804 8.75296 8.99807 8.70239 9.01734C8.67716 9.02695 8.65825 9.03381 8.64672 9.03791L8.63514 9.04198C8.24244 9.17311 8.03025 9.5977 8.16119 9.99053C8.29218 10.3835 8.71692 10.5959 9.10988 10.4649L8.8727 9.75336C9.10988 10.4649 9.11081 10.4646 9.11081 10.4646L9.11196 10.4642L9.11489 10.4632L9.12318 10.4604L9.14923 10.4512C9.17065 10.4436 9.20008 10.4329 9.23638 10.4191C9.30885 10.3915 9.40943 10.3512 9.52887 10.2981C9.76562 10.1929 10.087 10.0327 10.4137 9.8149C11.0214 9.40978 11.8724 8.65181 11.8727 7.50404C11.8737 6.79572 11.6239 6.1099 11.1678 5.568C10.7115 5.026 10.0782 4.66296 9.37988 4.54319C8.6816 4.42341 7.96346 4.55463 7.35266 4.91361C6.74186 5.27258 6.27781 5.83614 6.0427 6.50448C5.90525 6.89522 6.11058 7.3234 6.50132 7.46086C6.89206 7.59831 7.32025 7.39298 7.45771 7.00224C7.57526 6.66807 7.80728 6.38629 8.11268 6.20681ZM8.9327 12.0034C8.51849 12.0034 8.1827 12.3391 8.1827 12.7534C8.1827 13.1676 8.51849 13.5034 8.9327 13.5034H8.9402C9.35442 13.5034 9.6902 13.1676 9.6902 12.7534C9.6902 12.3391 9.35442 12.0034 8.9402 12.0034H8.9327Z"
                fill="#384250"
              />
            </svg>
          </div>
          <p class="tooltip-title-text">
            {{ title }}
          </p>
        </span>
      }
      @if (template) {
        <ng-container *ngTemplateOutlet="template; context: templateContext" />
      } @else {
        <p class="tooltip-text">
          {{ text }}
        </p>
      }
    </div>
  }
</div>
