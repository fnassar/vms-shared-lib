<div class="main-div" [style]="{ '--height': height }">
  @if (label) {
    <label [for]="label" [class]="'custom-label ' + labelClass">
      {{ label }}
    </label>
  }
  <div
    [class]="
      'search-input-wrapper' +
      (style === 'white' ? ' white' : style === 'grey' ? ' grey' : '')
    "
  >
    <span
      [class]="
        'search-icon' +
        (style === 'white' ? ' white' : style === 'grey' ? ' grey' : '')
      "
      [style.width]="'2rem'"
      [style.height]="'2rem'"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 20 20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M9.16582 1.04199C4.67865 1.04217 1.04082 4.67979 1.04082 9.16699C1.04082 13.6542 4.67865 17.2918 9.16582 17.292C11.1847 17.292 13.0309 16.5546 14.452 15.3359L17.8904 18.7754C18.1345 19.0195 18.5311 19.0195 18.7752 18.7754C19.0189 18.5313 19.019 18.1356 18.7752 17.8916L15.3357 14.4512C16.5538 13.0303 17.2908 11.1852 17.2908 9.16699C17.2908 4.67968 13.6531 1.04199 9.16582 1.04199ZM9.16582 2.29199C12.9628 2.29199 16.0408 5.37003 16.0408 9.16699C16.0408 12.964 12.9628 16.042 9.16582 16.042C5.36901 16.0418 2.29082 12.9638 2.29082 9.16699C2.29082 5.37014 5.36901 2.29217 9.16582 2.29199Z"
          fill="currentColor"
          fill-opacity="0.502"
        />
      </svg>
    </span>

    <input
      [id]="label || name"
      type="text"
      [name]="name"
      [placeholder]="placeholder"
      [class]="
        'custom-input' +
        (style === 'white' ? ' white' : style === 'grey' ? ' grey' : '') +
        ' ' +
        class
      "
      [(ngModel)]="value"
      (ngModelChange)="emitSearch($event)"
    />
  </div>
</div>
