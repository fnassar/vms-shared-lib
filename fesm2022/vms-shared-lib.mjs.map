@if (isVisible) {
  <div
    class="modal-overlay flex flex-row justify-start align-starty"
    (click)="onOverlayClick($event)"
  >
    <div class="background-effect" (click)="onOverlayClick($event)"></div>
    <div class="flex flex-row" style="z-index: 1002">
      <div
        class="modal-content"
        [@.disabled]="type !== 'notifcation'"
        @dialogAnim
      >
        <div class="modal-body">
          <div class="modal-header">
            <div class="modal-header-title">
              @if (modalIcon) {
                <div
                  class="modal-icon-container"
                  [ngClass]="[type, modalIconClass]"
                >
                  <img class="modal-icon" [src]="modalIcon" alt="" />
                </div>
              }
              <div class="modal-message">
                <p class="main-text">{{ modalText | translate }}</p>
              </div>
            </div>
            <button
              type="button"
              class="btn-close-icon"
              aria-label="Close"
              (click)="closeEvent.emit(); close()"
            >
              <div
                class="close-icon-container"
                style="width: 100%; height: 100%"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <g opacity="0.6">
                    <path
                      d="M5.00098 5L19 18.9991"
                      stroke="#595959"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      d="M4.99996 18.9991L18.999 5"
                      stroke="#595959"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </g>
                </svg>
              </div>
            </button>
          </div>

          @if (modalSubText || modalExtraText) {
            <div class="modal-message">
              @if (modalSubText) {
                <p class="sub-text">{{ modalSubText | translate }}</p>
              }
              <!-- @if (modalExtraText) { -->
              <p class="extra-text">{{ modalExtraText | translate }}</p>
              <!-- } -->
            </div>
          }
        </div>

        @if (type === "confirmation") {
          <div class="modal-actions">
            <button
              class="vms-btn"
              [ngClass]="cancelButtonStyle"
              (click)="cancelEvent.emit(); close()"
            >
              {{ cancelButtonText | translate }}
            </button>

            <button
              class="vms-btn"
              [ngClass]="confirmButtonStyle"
              (click)="checkSuccess()"
              [disabled]="this.loadingService.loading() && successPressed"
            >
              {{
                confirmButtonText
                  ? (confirmButtonText | translate)
                  : ("GENERAL.YES" | translate)
              }}
            </button>
          </div>
        }
      </div>
    </div>
  </div>
}
