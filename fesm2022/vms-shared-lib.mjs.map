<div class="full-width">
  <div
    [ngClass]="'checkBox-style ' + componentClass"
    style="display: flex; align-items: center; gap: 0.8rem"
  >
    <input
      [id]="customId ?? uniqueId"
      type="checkbox"
      [name]="name"
      [class]="'custom-checkbox ' + checkboxClass"
      [checked]="value"
      (change)="toggleValue($event)"
      [disabled]="disabled"
    />

    @if(label){
    <label
      [for]="uniqueId"
      [class]="'custom-label ' + labelClass"
      style="cursor: pointer; user-select: none"
    >
      {{ label | translate }}
    </label>
    }
  </div>
</div>
