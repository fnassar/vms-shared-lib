<div class="full-width" [formGroup]="parentForm">
  <div [ngClass]="'checkBox-style' + componentClass">
    <input
      [id]="uniqueId"
      type="checkbox"
      [name]="name"
      [class]="'custom-checkbox ' + checkboxClass"
      [formControlName]="controlName"
      [class.disabled]="disabled"
      (click)="disabled ? $event.preventDefault() : null"
    />

    @if (label) {
      <label [for]="label" [class]="'custom-label ' + labelClass">
        {{ label }}
      </label>
    }
  </div>
      <div class="check-error-container">
      <custom-app-error
        [control]="parentForm.controls[controlName]"
        [validation]="validation"
        [name]="name"
      />
    </div>
</div>
