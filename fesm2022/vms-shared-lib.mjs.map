<div [formGroup]="parentForm">
  <div
    class="main-toggle-container"
    [ngStyle]="{ '--height': height }"
    [class.label-top]="labelPosition === 'top'"
    [class.label-bottom]="labelPosition === 'bottom'"
    [class.label-left]="labelPosition === 'left'"
    [class.label-right]="labelPosition === 'right'"
  >
    <!-- @if (label && (labelPosition === "top" || labelPosition === "left")) { -->
    <label [for]="label" [class]="'custom-label '" style="text-wrap: nowrap">
      {{ label }}

      @if (containRequiredError()) {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >*</span
        >
      } @else {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >&nbsp;</span
        >
      }
    </label>
    <!-- } -->
    <div
      (click)="toggle()"
      class="toggle-container"
      [class.disabled]="disabled"
    >
      <div
        class="toggle-switch"
        [class.active]="value"
        [class.small]="size === 'small'"
        [class.medium]="size === 'medium'"
        [class.large]="size === 'large'"
        [style.background-color]="value ? onColor : offColor"
      >
        <div
          class="toggle-thumb"
          [class.active]="value"
          [class.small]="size === 'small'"
          [class.medium]="size === 'medium'"
          [class.large]="size === 'large'"
          [style.background-color]="thumbColor"
        ></div>
      </div>

      @if (trueValue) {
        <span class="toggle-value right">{{
          value ? trueValue.nameEn || "true" : falseValue.nameEn || "false"
        }}</span>
      }
    </div>
    <!-- @if (label && (labelPosition === "bottom" || labelPosition === "right")) {
      <label [for]="label" [class]="'custom-label '">
        {{ label }}

        @if (containRequiredError()) {
          <span style="color: #f43f5e; font-size: 15px; font-weight: 500"
            >*</span
          >
        } @else {
          <span style="color: #f43f5e; font-size: 15px; font-weight: 500"
            >&nbsp;</span
          >
        }
      </label>
    } -->
  </div>
</div>
