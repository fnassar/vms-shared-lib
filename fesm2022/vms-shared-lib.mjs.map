@if (hasAnyErrorToShow()) {
  <div class="error-container" [DropdownAnimationObject]="hasAnyErrorToShow()">
    @if (
      this.control.invalid &&
      (this.control.touched || this.control.dirty) &&
      this.getErrorMessage.length > 0
    ) {
      <div class="input-error-message">
        <span class="input-error-icon">
          <svg
            width="14"
            height="14"
            viewBox="0 0 14 14"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M6.75 4.08333V6.75M6.75 9.41667H6.75667M0.75 6.75C0.75 7.53793 0.905195 8.31815 1.20672 9.0461C1.50825 9.77405 1.95021 10.4355 2.50736 10.9926C3.06451 11.5498 3.72595 11.9917 4.4539 12.2933C5.18185 12.5948 5.96207 12.75 6.75 12.75C7.53793 12.75 8.31815 12.5948 9.0461 12.2933C9.77405 11.9917 10.4355 11.5498 10.9926 10.9926C11.5498 10.4355 11.9917 9.77405 12.2933 9.0461C12.5948 8.31815 12.75 7.53793 12.75 6.75C12.75 5.1587 12.1179 3.63258 10.9926 2.50736C9.86742 1.38214 8.3413 0.75 6.75 0.75C5.1587 0.75 3.63258 1.38214 2.50736 2.50736C1.38214 3.63258 0.75 5.1587 0.75 6.75Z"
              stroke="#F04438"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        @for (item of validation; track $index) {
          @if (shouldShowError(item)) {
            <span
              class="error-message"
              [title]="getErrorMessage(item) | translate"
            >
              {{ getErrorMessage(item) | translate }}
            </span>
          }
        }
      </div>
    }
  </div>
}
