<div class="overlay-container" [style]="{ '--max-height': maxHeight }">
  <!-- Target content -->
  <div class="cursor-pointer" (click)="toggleDropdown($event)">
    @if (targetTemplate) {
      <ng-container>
        <ng-container *ngTemplateOutlet="targetTemplate"></ng-container>
      </ng-container>
    }
  </div>

  <!-- Overlay content -->
  @if (isOpen) {
    <div
      #overlayPanel
      class="overlay"
      [class]="'overlay ' + overlayClass"
      [class.show]="isOpen"
      [class.right]="expandSide === 'RIGHT'"
      [class.left]="expandSide === 'LEFT'"
      [clickOutside]="overlayPanel"
      (clickOutsideEmitter)="closeDropdown()"
      [DropdownAnimationObject]="isOpen"
      (click)="onOverlayClick($event)"
    >
      @if (overlayTemplate) {
        <ng-container>
          <ng-container *ngTemplateOutlet="overlayTemplate"></ng-container>
        </ng-container>
      }
    </div>
  }
</div>
