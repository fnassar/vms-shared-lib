<div style="width: 100%" [formGroup]="parentForm">
  @if (label) {
    <label [for]="label" [class]="'custom-label ' + labelClass">
      {{ label }}

      @if (containRequiredError()) {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >*</span
        >
      } @else {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >&nbsp;</span
        >
      }
    </label>
  }
  <div
    class="input-error-container"
    [class.has-error]="
      parentForm.controls[controlName].invalid &&
      parentForm.controls[controlName].touched
    "
  >
    <div class="textarea-wrapper">
      <textarea
        [ngStyle]="{ resize: resizable(), height: customHeight() }"
        [id]="label"
        [name]="name"
        [placeholder]="placeholder"
        [class]="'custom-textarea ' + class"
        [formControlName]="controlName"
        [class.has-error]="parentForm.controls[controlName].invalid"
        [rows]="rows"
      >
      </textarea>
      <!-- <span class="custom-resize-handle">
        <svg
          width="8"
          height="11"
          viewBox="0 0 8 11"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M0.5 8.84277L5.59091 0.500061"
            stroke="#9DA4AE"
            stroke-linecap="round"
          />
          <path
            d="M4.5 9.51416L7.50002 4.32876"
            stroke="#9DA4AE"
            stroke-linecap="round"
          />
        </svg>
      </span> -->
    </div>
  </div>
  <div class="text-area-error-container">
    <custom-app-error
      [control]="parentForm.controls[controlName]"
      [validation]="validation"
      [name]="name"
    />
  </div>
</div>
