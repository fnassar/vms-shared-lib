@if(label){
<label [for]="label" [class]="'custom-label ' + labelClass">
  {{ label }}
  @if(required){
  <span
    style="
      color: var(--vms-color-alert-error);
      font-size: 0.95em;
      font-weight: 500;
    "
    >*</span
  >
  }
</label>
}
<textarea
  [id]="label"
  [name]="name"
  [placeholder]="placeholder"
  [class]="'custom-textarea ' + class"
  [(ngModel)]="value"
  (ngModelChange)="valueChange.emit($event)"
  [rows]="rows"
  [required]="required"
></textarea>
