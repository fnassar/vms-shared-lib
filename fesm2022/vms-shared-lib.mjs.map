<div style="width: 100%" [formGroup]="parentForm" class="input-wrapper">
  @if (label) {
    <label
      [for]="label"
      [class]="'custom-label ' + labelClass"
      [class.disabled-label]="disabled"
    >
      {{ label }}

      @if (containRequiredError()) {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >*</span
        >
      } @else {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >&nbsp;</span
        >
      }
    </label>
  }

  <div class="plate-inputs-container">
    <!-- Letters Input -->
    <div
      class="input-container letters-container"
      [class.has-error]="
        parentForm.controls[controlName].invalid &&
        parentForm.controls[controlName].touched &&
        !disabled
      "
      [ngStyle]="{ '--height': height, '--border-radius': borderRadius }"
    >
      <input
        [id]="label ? label + '-letters' : name + '-letters'"
        type="text"
        [name]="name + '-letters'"
        [placeholder]="placeholderLetters || 'ABC'"
        class="custom-input plate-input letters-input"
        [value]="lettersValue"
        (input)="onLettersInput($event)"
        (keydown)="preventInvalidInput($event, 'letters')"
        [class.has-error]="
          parentForm.controls[controlName].invalid &&
          parentForm.controls[controlName].touched &&
          !disabled
        "
        [disabled]="disabled"
        [maxLength]="maxLetters * 2 - 1"
        [minLength]="maxLetters * 2 - 1"
      />
    </div>

    <!-- Numbers Input -->
    <div
      class="input-container digits-container"
      [class.has-error]="
        parentForm.controls[controlName].invalid &&
        parentForm.controls[controlName].touched &&
        !disabled
      "
      [ngStyle]="{ '--height': height, '--border-radius': borderRadius }"
    >
      <input
        [id]="label ? label + '-digits' : name + '-digits'"
        type="text"
        [name]="name + '-digits'"
        [placeholder]="placeholderDigits || '1234'"
        class="custom-input plate-input digits-input"
        [value]="digitsValue"
        (input)="onDigitsInput($event)"
        (keydown)="preventInvalidInput($event, 'digits')"
        [class.has-error]="
          parentForm.controls[controlName].invalid &&
          parentForm.controls[controlName].touched &&
          !disabled
        "
        [disabled]="disabled"
        [maxLength]="maxDigits * 2 - 1"
        [minLength]="maxDigits * 2 - 1"
      />
    </div>
  </div>

  <div class="input-error-container">
    <custom-app-error
      [control]="parentForm.controls[controlName]"
      [validation]="validation"
      [name]="name"
    />
  </div>
</div>
