<div style="width: 100%" [class]="'' + componentClass" [formGroup]="parentForm">
  @if (label) {
    <label [for]="label" [class]="'custom-label ' + labelClass">
      {{ label }}
      @if (containRequiredError()) {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >*</span
        >
      } @else {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >&nbsp;</span
        >
      }
    </label>
  }

  <div [class]="'custom-calendar-container ' + calendarContainerClass">
    <!-- Dropdown header / trigger -->
    <div
      [class]="'calendar-dropdown-header ' + calendarInputClass"
      [class.has-error]="
        parentForm.controls[controlName].invalid &&
        parentForm.controls[controlName].touched
      "
      [class.disabled]="disabled"
      (click)="!disabled && toggleCalendar()"
    >
      <span class="calendar-display-value" [class.placeholder]="!value">
        {{ value ? formatDisplayDate() : placeholder }}
      </span>
      <div class="calendar-header-icons">
        @if (value) {
          <span class="clear-icon" (click)="clearDate($event)">
            <svg
              viewBox="0 0 17 17"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g clip-path="url(#clip0_cal_clear)">
                <path
                  d="M15.0539 1.8631L1.69678 15.2202"
                  stroke="#999999"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M1.69678 1.8631L15.0539 15.2202"
                  stroke="#999999"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </g>
              <defs>
                <clipPath id="clip0_cal_clear">
                  <rect
                    width="15.5833"
                    height="15.5833"
                    fill="white"
                    transform="translate(0.583496 0.75)"
                  />
                </clipPath>
              </defs>
            </svg>
          </span>
        }
        <!-- Calendar icon -->
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M5.333 1.333v1.334M10.667 1.333v1.334M2 6h12M2.667 2.667h10.666C13.403 2.667 14 3.264 14 4v9.333c0 .737-.597 1.334-1.333 1.334H2.667A1.334 1.334 0 0 1 1.333 13.333V4c0-.736.597-1.333 1.334-1.333Z"
            stroke="#4B4F55"
            stroke-width="1.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>

    <!-- Dropdown overlay -->
    @if (showCalendarForm) {
      <div
        #calendarPopUpForm
        [class]="'calendar-dropdown-overlay ' + calendarPopUpClass"
        [clickOutside]="calendarPopUpForm"
        (clickOutsideEmitter)="showCalendarForm = false"
      >
        <div [dir]="'ltr'" class="calendar-header">
          <button type="button" class="nav-button" (click)="prevMonth()">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M8.94571 10.0036L12.7541 13.8117L11.666 14.8997L6.76953 10.0036L11.666 5.10742L12.7541 6.19546L8.94571 10.0036Z"
                fill="#3D4354"
              />
            </svg>
          </button>
          <div class="month-title">{{ getMonthName() }} {{ getYear() }}</div>
          <button type="button" class="nav-button" (click)="nextMonth()">
            <svg
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M11.5007 10.0036L7.69238 6.19546L8.78048 5.10742L13.677 10.0036L8.78048 14.8997L7.69238 13.8117L11.5007 10.0036Z"
                fill="#3D4354"
              />
            </svg>
          </button>
        </div>

        <div class="calendar-content">
          <div class="weekdays">
            @for (weekday of weekdays; track weekday) {
              <div class="weekday">
                {{ weekday }}
              </div>
            }
          </div>

          <div class="days-grid">
            @for (day of days; track day) {
              <div
                class="day"
                [class.current-month]="isCurrentMonth(day)"
                [class.selected]="isSelected(day)"
                [class.disabled]="isDisabled(day) || disabled"
                [class.today]="isToday(day)"
                (click)="dayClick($event, day)"
              >
                <p>
                  {{ day.getDate() }}
                </p>
              </div>
            }
          </div>
        </div>
      </div>
    }

    <div class="calendar-error-container">
      <custom-app-error
        [control]="parentForm.controls[controlName]"
        [validation]="validation"
        [name]="name"
      />
    </div>
  </div>
</div>
