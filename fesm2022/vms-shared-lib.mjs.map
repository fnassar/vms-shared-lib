<div
  style="width: 100%"
  class="input-wrapper"
  [style.display]="vmsFlexDesignMood ? 'flex' : 'block'"
  [style.align-items]="vmsFlexDesignMood ? 'center' : 'unset'"
  [style.justify-content]="vmsFlexDesignMood ? 'center' : 'unset'"
  style="width: 100%; height: auto; gap: 1.5em"
>
  @if (label) {
    <label [for]="label" [class]="'custom-label ' + labelClass">
      {{ label | translate }}

      @if (required) {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
        >
          *
        </span>
      }
    </label>
  }
  <div class="input-container" style="flex: 1; width: 100%">
    <input
      [id]="(customId ?? label) || name"
      [type]="type"
      [name]="name"
      [placeholder]="placeholder | translate"
      [class]="'custom-input ' + class"
      [(ngModel)]="value"
      (ngModelChange)="!disabled && valueChange.emit($event)"
      [required]="required"
      [style.height]="height"
      [disabled]="disabled"
      [style.borderColor]="
        vmsFlexDesignMood
          ? 'var(--vms-neutral-light-active, #d2d6db)'
          : '#82828233'
      "
      [style.backgroundColor]="
        vmsFlexDesignMood && disabled
          ? 'var(--vms-neutral-light-disabled, #f2f2f2)'
          : 'var(--vms-color-white, #ffffff)'
      "
    />
  </div>
</div>
