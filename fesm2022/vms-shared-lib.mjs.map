<div style="width: 100%" [formGroup]="parentForm" class="input-wrapper">
  @if (label) {
    <label
      [for]="label"
      [class]="'custom-label ' + labelClass"
      [class.disabled-label]="disabled"
    >
      {{ label }}

      @if (containRequiredError()) {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >*</span
        >
      } @else {
        <span
          style="
            color: var(--vms-color-alert-error);
            font-size: 0.95em;
            font-weight: 500;
          "
          >&nbsp;</span
        >
      }
    </label>
  }

  <div
    class="input-container"
    [class.has-error]="
      parentForm.controls[controlName].invalid &&
      parentForm.controls[controlName].touched &&
      !disabled
    "
    [ngStyle]="{ '--height': height, '--border-radius': borderRadius }"
  >
    <input
      [id]="label || name"
      [type]="type"
      [name]="name"
      [placeholder]="placeholder"
      [class]="'custom-input ' + class"
      [formControlName]="controlName"
      (ngModelChange)="valueChange.emit($event)"
      [pattern]="pattern"
      [class.has-error]="
        parentForm.controls[controlName].invalid &&
        parentForm.controls[controlName].touched &&
        !disabled
      "
      [disabled]="disabled"
      [min]="type === 'number' ? 0 : null"
      [minlength]="getMinLength()"
      [maxlength]="getMaxLength()"
      (keydown)="preventInvalidNumberInput($event)"
    />
    <!-- Error icon (SVG) -->

    @if (type === "password" || (type === "text" && showPassword)) {
      <button
        [ngClass]="{
          'eye-icon-position':
            parentForm.controls[controlName].invalid &&
            parentForm.controls[controlName].touched,
        }"
        type="button"
        class="input-icon-passwrord-eye"
        (click)="togglePasswordVisibility()"
        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      >
        @if (showPassword) {
          <!-- eye (show) -->
          <svg
            width="1.2em"
            height="1.2em"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <circle
              cx="12"
              cy="12"
              r="3"
              stroke="currentColor"
              stroke-width="1.6"
            />
          </svg>
        } @else {
          <!-- eye-off (hide) -->
          <svg
            width="1.2em"
            height="1.2em"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <path
              d="M3 3l18 18"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              d="M10.58 10.58A3 3 0 0012 15a3 3 0 002.42-4.42M9.9 4.24A10.91 10.91 0 0112 4c6.5 0 10 7 10 7a17.21 17.21 0 01-3.07 3.62M6.24 6.24A17.77 17.77 0 002 11s3.5 7 10 7a10.86 10.86 0 004.76-1.07"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
      </button>
    }
    @if (type === "number") {
      @if (numberType === "currency") {
        <div
          class="currency-icon"
          [ngClass]="{
            'currency-icon-position':
              parentForm.controls[controlName].invalid &&
              parentForm.controls[controlName].touched,
          }"
        >
          <svg
            width="auto"
            height="auto"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M11.4043 3.50758C12.0889 2.76204 12.508 2.41268 13.3107 1.93701V12.5812L18.0567 11.6046C18.0045 12.077 17.9538 12.2777 17.862 12.6208C17.7701 12.964 17.6832 13.2479 17.5129 13.6305L11.4043 14.9041V3.50758Z"
              fill="#602650"
            />
            <path
              d="M9.52539 1C8.53861 1.56741 8.37079 1.77868 7.62089 2.53089V14.2574L2.47698 15.3463C2.19504 15.8346 1.91311 17.3392 1.93325 17.3655C1.95339 17.3919 7.36195 16.2041 7.52499 16.2041C7.84115 16.059 8.04187 15.9732 8.25668 15.7158C8.47149 15.4584 8.75342 15.0295 8.75342 15.0295L9.29716 14.2112C9.46104 13.9804 9.51437 13.8411 9.52539 13.5711V1Z"
              fill="#602650"
            />
            <path
              d="M3.38062 11.0031L18.0673 7.89648C17.9229 8.80532 17.7961 9.25483 17.4968 9.95637L2.83691 13.063C2.9408 12.2871 3.02403 11.8459 3.38062 11.0031Z"
              fill="#602650"
            />
            <path
              d="M11.9457 16.913L18.06 15.6514C17.9432 16.5008 17.8267 16.9536 17.5097 17.7116L11.3887 19C11.5265 18.1926 11.6504 17.7392 11.9457 16.913Z"
              fill="#602650"
            />
          </svg>
        </div>
      } @else if (numberType === "time") {
        <div
          class="time-icon"
          [ngClass]="{
            'time-icon-position':
              parentForm.controls[controlName].invalid &&
              parentForm.controls[controlName].touched,
          }"
        >
          <svg
            width="auto"
            height="auto"
            viewBox="0 0 26 13"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M0.372159 1.36364H2.50284L6.20739 10.4091H6.34375L10.0483 1.36364H12.179V13H10.5085V4.57955H10.4006L6.96875 12.983H5.58239L2.15057 4.57386H2.04261V13H0.372159V1.36364ZM14.5952 13V4.27273H16.294V13H14.5952ZM15.4531 2.92614C15.1577 2.92614 14.9039 2.82765 14.6918 2.63068C14.4834 2.42992 14.3793 2.19129 14.3793 1.91477C14.3793 1.63447 14.4834 1.39583 14.6918 1.19886C14.9039 0.998106 15.1577 0.897727 15.4531 0.897727C15.7486 0.897727 16.0005 0.998106 16.2088 1.19886C16.4209 1.39583 16.527 1.63447 16.527 1.91477C16.527 2.19129 16.4209 2.42992 16.2088 2.63068C16.0005 2.82765 15.7486 2.92614 15.4531 2.92614ZM20.2784 7.81818V13H18.5795V4.27273H20.2102V5.69318H20.3182C20.5189 5.23106 20.8333 4.85985 21.2614 4.57955C21.6932 4.29924 22.2367 4.15909 22.892 4.15909C23.4867 4.15909 24.0076 4.28409 24.4545 4.53409C24.9015 4.7803 25.2481 5.14773 25.4943 5.63636C25.7405 6.125 25.8636 6.72917 25.8636 7.44886V13H24.1648V7.65341C24.1648 7.02083 24 6.52652 23.6705 6.17045C23.3409 5.81061 22.8883 5.63068 22.3125 5.63068C21.9186 5.63068 21.5682 5.71591 21.2614 5.88636C20.9583 6.05682 20.7178 6.30682 20.5398 6.63636C20.3655 6.96212 20.2784 7.35606 20.2784 7.81818Z"
              fill="#D0D0D0"
            />
          </svg>
        </div>
      } @else if (numberType === "discount") {
        <div
          class="discount-icon"
          [ngClass]="{
            'discount-icon-position':
              parentForm.controls[controlName].invalid &&
              parentForm.controls[controlName].touched,
          }"
        >
          <svg
            width="auto"
            height="auto"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g opacity="0.5">
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M2.06999 11.7541C2.41503 11.7462 2.70077 12.0194 2.70866 12.3644C2.75982 14.6016 2.98612 15.6429 3.67155 16.3283C4.357 17.0137 5.39828 17.24 7.63542 17.2912C7.98046 17.2991 8.25366 17.5848 8.24577 17.9299C8.23787 18.2748 7.95203 18.5479 7.6071 18.5402C5.41599 18.4901 3.8696 18.2939 2.78776 17.2121C1.70593 16.1302 1.50974 14.5839 1.45964 12.3927C1.45185 12.0477 1.72496 11.762 2.06999 11.7541ZM17.9313 11.7541C18.2763 11.762 18.5504 12.0477 18.5426 12.3927C18.4925 14.5839 18.2954 16.1302 17.2135 17.2121C16.1318 18.2937 14.586 18.4901 12.3952 18.5402C12.0501 18.5481 11.7634 18.2749 11.7555 17.9299C11.7477 17.5849 12.021 17.2993 12.3659 17.2912C14.6028 17.24 15.6443 17.0135 16.3298 16.3283C17.0152 15.6429 17.2415 14.6016 17.2926 12.3644C17.3005 12.0195 17.5864 11.7464 17.9313 11.7541ZM13.3415 12.4992C13.8017 12.4992 14.1755 12.872 14.1755 13.3322C14.1755 13.7924 13.8017 14.1652 13.3415 14.1652H13.3346C12.8744 14.1652 12.5007 13.7924 12.5007 13.3322C12.5007 12.872 12.8744 12.4992 13.3346 12.4992H13.3415ZM12.8923 6.2238C13.1363 5.97972 13.532 5.97972 13.776 6.2238C14.02 6.46788 14.0201 6.86354 13.776 7.10759L7.10905 13.7746C6.86497 14.0182 6.46921 14.0184 6.22526 13.7746C5.98119 13.5305 5.98119 13.1339 6.22526 12.8898L12.8923 6.2238ZM7.6071 1.4572C7.95191 1.4495 8.23769 1.72275 8.24577 2.06755C8.25366 2.41261 7.98047 2.69926 7.63542 2.7072C5.3982 2.75835 4.35699 2.98465 3.67155 3.67009C2.98634 4.35549 2.75983 5.39629 2.70866 7.63298C2.70077 7.97802 2.41502 8.25213 2.06999 8.24431C1.7249 8.23642 1.45175 7.94975 1.45964 7.60466C1.50974 5.41375 1.70617 3.8681 2.78776 2.7863C3.8696 1.70446 5.41594 1.5073 7.6071 1.4572ZM12.3952 1.4572C14.5862 1.50731 16.1318 1.70451 17.2135 2.7863C18.2953 3.86811 18.4925 5.41363 18.5426 7.60466C18.5505 7.94975 18.2764 8.23642 17.9313 8.24431C17.5864 8.25194 17.3005 7.97791 17.2926 7.63298C17.2415 5.39611 17.0151 4.35549 16.3298 3.67009C15.6443 2.98465 14.6031 2.75835 12.3659 2.7072C12.021 2.69908 11.7477 2.4125 11.7555 2.06755C11.7636 1.72263 12.0502 1.44931 12.3952 1.4572ZM6.67546 5.8322C7.13536 5.83246 7.50829 6.20528 7.50847 6.66521C7.50847 7.12528 7.13547 7.49893 6.67546 7.49919H6.66765C6.20741 7.49919 5.83464 7.12544 5.83464 6.66521C5.83482 6.20512 6.20752 5.8322 6.66765 5.8322H6.67546Z"
                fill="#4B4F55"
              />
            </g>
          </svg>
        </div>
      }
    }
  </div>
  <div class="input-error-container">
    <custom-app-error
      [control]="parentForm.controls[controlName]"
      [validation]="validation"
      [name]="name"
    />
  </div>
</div>
