<div class="host" [class]="{ isExpanded: isExpanded() }">
  <div
    class="main"
    [style]="{
      '--padding': padding,
      '--border-radius': borderRadius,
      '--background-color': backgroundColor,
      '--border-color': borderColor,
    }"
    [class.expanded]="isExpanded()"
    [@expandingOuterAnimation]="isExpanded() ? 'enter' : 'leave'"
  >
    <!-- Target/Header Section -->
    <div
      class="expandable-header"
      [class]="{
        spaceB: true,
        'expanded-border': isExpanded() && showBorderBottom,
      }"
      (click)="toggle()"
    >
      <ng-content select="[target]"></ng-content>

      @if (showIcon1) {
        <div class="expand-icon-container" style="width: 2em; height: 2em">
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7.4248 16.6004L12.8581 11.1671C13.4998 10.5254 13.4998 9.47539 12.8581 8.83372L7.4248 3.40039"
              stroke="#9DA4AE"
              stroke-width="1.5"
              stroke-miterlimit="10"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      } @else {
        <!-- if(isExpanded()){ -->
        <div class="expand-icon-container" style="width: 1.6em; height: 1.6em">
          <svg
            width="auto"
            height="auto"
            viewBox="0 0 16 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            [style.transform]="isExpanded() ? 'rotate(0deg)' : 'rotate(-90deg)'"
            style="transition: all 0.3s ease"
          >
            <path
              d="M7.99967 14.6663C11.6816 14.6663 14.6663 11.6816 14.6663 7.99967C14.6663 4.31778 11.6816 1.33301 7.99967 1.33301C4.31778 1.33301 1.33301 4.31778 1.33301 7.99967C1.33301 11.6816 4.31778 14.6663 7.99967 14.6663Z"
              stroke="#9E9595"
              stroke-miterlimit="10"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M5.64648 7.16016L7.99982 9.50682L10.3532 7.16016"
              stroke="#9E9595"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      }
    </div>

    <!-- Expandable Content Section -->
    @if (isExpanded()) {
      <div class="expandable-content" [@dropdownAnimation]="isExpanded()">
        <!--  ? 'enter' : 'leave' -->
        <!-- <div class="expandable-content-inner"> -->
        <ng-content select="[content]"></ng-content>
        <!-- </div> -->
      </div>
    }
  </div>
</div>
