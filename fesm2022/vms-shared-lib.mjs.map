<div class="tabs-container">
    <div class="tabs-layout">

  @if (isDesktop) {


      <div class="side-tabs">
        @for (tab of tabs; track tab.id) {
          <button
            (click)="selectTab(tab)"
            class="tab-item"
            [class.active]="activeId === tab.id"
            [class.disabled]="tab.disabled">

            <div class="tab-btn">
              @if (tab.icon) {
                <span class="icon"
                      [innerHTML]="getSafeSvg(tab.icon)">
                </span>
              }

              <span class="label">
                {{ getLabel(tab) }}
              </span>
            </div>

          </button>
        }
      </div>


  } @else {

    <overlay-panel
      #TabOverlay
      [overlayClass]="'custom-class'"
      [expandSide]="'RIGHT'">

      <ng-template #target>
        <button class="tab-item active">
          <div class="tab-btn">

            @if (getTab(activeId)?.icon) {
              <span class="icon"
                    [innerHTML]="getSafeSvg(getTab(activeId)?.icon)">
              </span>
            }

            <span class="label">
              {{ getLabel(getTab(activeId)) }}
            </span>
          </div>
                  <svg
          width="8"
          height="6"
          viewBox="0 0 8 6"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M0.860142 1.10988C0.985051 0.985709 1.15402 0.916015 1.33014 0.916015C1.50627 0.916015 1.67523 0.985709 1.80014 1.10988L4.19348 3.46988L6.55348 1.10988C6.67838 0.98571 6.84735 0.916016 7.02348 0.916016C7.1996 0.916016 7.36857 0.98571 7.49347 1.10988C7.55596 1.17185 7.60556 1.24559 7.6394 1.32683C7.67325 1.40807 7.69067 1.4952 7.69067 1.58321C7.69067 1.67122 7.67325 1.75836 7.6394 1.8396C7.60556 1.92083 7.55596 1.99457 7.49347 2.05654L4.66681 4.88321C4.60483 4.9457 4.5311 4.99529 4.44986 5.02914C4.36862 5.06298 4.28148 5.08041 4.19347 5.08041C4.10547 5.08041 4.01833 5.06298 3.93709 5.02914C3.85585 4.99529 3.78212 4.9457 3.72014 4.88321L0.860142 2.05654C0.797656 1.99457 0.748061 1.92083 0.714215 1.83959C0.680369 1.75836 0.662943 1.67122 0.662943 1.58321C0.662943 1.4952 0.680369 1.40807 0.714215 1.32683C0.748061 1.24559 0.797657 1.17185 0.860142 1.10988Z"
            fill="#4B4F55"
          />
        </svg>
        </button>
      </ng-template>

      <ng-template #overlay>
        @for (tab of tabs; track tab.id) {
          <button
            (click)="selectTab(tab)"
            class="tab-item"
            [class.active]="activeId === tab.id"
            [class.disabled]="tab.disabled">

            <div class="tab-btn">
              @if (tab.icon) {
                <span class="icon"
                      [innerHTML]="getSafeSvg(tab.icon)">
                </span>
              }

              <span class="label">
                {{ getLabel(tab) }}
              </span>
            </div>

          </button>
        }
      </ng-template>

    </overlay-panel>

    <div class="settings-separator"></div>

  }

  <!-- SINGLE PROJECTION SLOT -->
  <div class="tab-content">
    <ng-content></ng-content>
  </div>

</div>
</div>
